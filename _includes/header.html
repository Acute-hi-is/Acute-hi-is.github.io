<header class="site-header">
  <div class="container site-header__inner">
    <div class="site-header__brand">
      <a href="{{ '/' | relative_url }}" class="site-logo">
        <img src="{{ '/images/logo_horizontal_white.svg' | relative_url }}" alt="ACUTE Research Laboratories">
      </a>
      <span class="site-header__divider" aria-hidden="true"></span>
      <a href="https://www.hi.is" class="site-header__hi" target="_blank" rel="noopener" title="University of Iceland — Háskóli Íslands">
        <img src="{{ '/images/partners/hi_white.png' | relative_url }}" alt="University of Iceland">
      </a>
    </div>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav"><ul class="site-nav__list">
      <li><a href="{{ '/' | relative_url }}" class="site-nav__link{% if page.url == '/' %} is-active{% endif %}">Home</a></li>
      <li><a href="{{ '/research/' | relative_url }}" class="site-nav__link{% if page.url contains '/research' %} is-active{% endif %}">Research</a></li>
      <li><a href="{{ '/projects/' | relative_url }}" class="site-nav__link{% if page.url contains '/projects' %} is-active{% endif %}">Projects</a></li>
      <li><a href="{{ '/facilities/' | relative_url }}" class="site-nav__link{% if page.url contains '/facilities' %} is-active{% endif %}">Facilities</a></li>
      <li><a href="{{ '/publications/' | relative_url }}" class="site-nav__link{% if page.url contains '/publications' %} is-active{% endif %}">Publications</a></li>
      <li><a href="{{ '/team/' | relative_url }}" class="site-nav__link{% if page.url contains '/team' %} is-active{% endif %}">Team</a></li>
      <li><a href="{{ '/news/' | relative_url }}" class="site-nav__link{% if page.url contains '/news' %} is-active{% endif %}">News</a></li>
      <li><a href="{{ '/contact/' | relative_url }}" class="site-nav__link{% if page.url contains '/contact' %} is-active{% endif %}">Contact</a></li>
    </ul></nav>
  </div>
</header>
